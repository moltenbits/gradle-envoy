name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # The plugin's own tests: unit tests plus the TestKit functional tests, which exercise both the
  # declared Gradle 8.8 floor and the current version. No secrets, so this runs on fork PRs too.
  # ---------------------------------------------------------------------------------------------
  plugin:
    name: Plugin tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # JDK 17 compiles the plugin (java.toolchain = 17); JDK 21 runs the Gradle daemon
      # (gradle/gradle-daemon-jvm.properties). Installing both keeps the Foojay resolver from
      # downloading ~200 MB per run. 21 is installed last, so JAVA_HOME satisfies the daemon
      # criteria without provisioning.
      - id: jdk17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - id: jdk21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Register the installed JDKs with Gradle
        uses: ./.github/actions/register-jdks
        with:
          jdk17-path: ${{ steps.jdk17.outputs.path }}
          jdk21-path: ${{ steps.jdk21.outputs.path }}

      - name: Run plugin tests
        run: ./gradlew check

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Consumer-perspective validation using the bundled fake `op`. Proves the full chain — .env
  # discovery, op:// resolution, injection into forked JVMs — without needing a vault, so it also
  # runs on fork PRs, which never receive secrets.
  # ---------------------------------------------------------------------------------------------
  examples-hermetic:
    name: Examples (hermetic, fake op)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: jdk17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - id: jdk21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Register the installed JDKs with Gradle
        uses: ./.github/actions/register-jdks
        with:
          jdk17-path: ${{ steps.jdk17.outputs.path }}
          jdk21-path: ${{ steps.jdk21.outputs.path }}

      - name: Verify examples against the fake 1Password CLI
        env:
          ENVOY_EXAMPLE_OP: ${{ github.workspace }}/examples/fake-op
        run: ./examples/verify.sh

  # ---------------------------------------------------------------------------------------------
  # The same validation against the REAL 1Password CLI, authenticated with a service account.
  # This is the only job that proves `op` integration actually works end to end.
  #
  # Skipped for pull requests from forks: GitHub does not pass secrets to those runners, so the
  # job could only ever fail there. `examples-hermetic` still covers fork contributions.
  # ---------------------------------------------------------------------------------------------
  examples-live:
    name: Examples (live 1Password)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # Secrets can be absent even on non-fork runs (e.g. a fork of this repo that has not
      # configured them). Detect that and skip the rest of the job rather than fail the build.
      - id: guard
        name: Check 1Password credentials are configured
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [[ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OP_SERVICE_ACCOUNT_TOKEN not set — skipping live 1Password validation."
          fi

      - if: steps.guard.outputs.configured == 'true'
        uses: 1password/install-cli-action@v4

      - if: steps.guard.outputs.configured == 'true'
        id: jdk17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.guard.outputs.configured == 'true'
        id: jdk21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.guard.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6

      - if: steps.guard.outputs.configured == 'true'
        name: Register the installed JDKs with Gradle
        uses: ./.github/actions/register-jdks
        with:
          jdk17-path: ${{ steps.jdk17.outputs.path }}
          jdk21-path: ${{ steps.jdk21.outputs.path }}

      # ENVOY_EXAMPLE_OP is deliberately unset so verify.sh switches to live mode and uses the real
      # `op` on PATH, resolving the reference committed in the examples' .env files.
      - if: steps.guard.outputs.configured == 'true'
        name: Verify examples against real 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: ./examples/verify.sh
